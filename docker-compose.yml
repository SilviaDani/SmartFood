#version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: smartfood_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: smartfood_backend
    command: python app.py
    volumes:
      - ./backend/smartfood/uploads:/app/uploads
      - ./backend/smartfood/trained_models:/app/trained_models
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/uploads/smartfood.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=9SUJ_bmJB7eSQz5OWS0nPLClLn2TByE-bnh6hyIjTBbC33mZBvZi51LEPWELdgJpoCXPxKWXs0Bx_CvXQOrSiw==
      - INFLUXDB_ORG=smart_food
      - INFLUXDB_BUCKET=smart_food_bucket_2023-2024-2025
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
    container_name: smartfood_celery_worker
    command: celery -A smartfood.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=100
    volumes:
      - ./backend/smartfood/trained_models:/app/trained_models
      - ./backend/smartfood/uploads:/app/uploads
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/uploads/smartfood.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=9SUJ_bmJB7eSQz5OWS0nPLClLn2TByE-bnh6hyIjTBbC33mZBvZi51LEPWELdgJpoCXPxKWXs0Bx_CvXQOrSiw==
      - INFLUXDB_ORG=smart_food
      - INFLUXDB_BUCKET=smart_food_bucket_2023-2024-2025
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smartfood_frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=smart_food
      - DOCKER_INFLUXDB_INIT_BUCKET=smart_food_bucket_2023-2024-2025
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=9SUJ_bmJB7eSQz5OWS0nPLClLn2TByE-bnh6hyIjTBbC33mZBvZi51LEPWELdgJpoCXPxKWXs0Bx_CvXQOrSiw==
      - REACT_APP_API_URL=http://backend:8000
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  influxdb_data:
  redis_data:
