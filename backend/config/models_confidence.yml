# Configurazione modelli di predizione e visualizzazione confidenze
models:
  # Modelli che supportano confidence scores
  - name: "chronos"
    display_name: "Chronos Forecasting"
    type: "timeseries"
    supports_confidence: true
    min_confidence_threshold: 0.45
    description: "Amazon's foundation model for time series forecasting with zero-shot capability"

  # MOMENT disabilitato: richiede transformers==4.33.3, incompatibile con chronos-forecasting (>=4.41)
  # - name: "moment"
  #   display_name: "MOMENT Moving Average"
  #   ...

  # TimesFM disabilitato: il pacchetto PyPI usa JAX, incompatibile con l'ambiente PyTorch corrente
  # - name: "timesfm"
  #   display_name: "TimesFM-2.5 (Google)"
  #   ...

# Configurazione visualizzazione
visualization:
  confidence_color_scheme:
    high: "#4CAF50"      # Verde
    medium: "#FFC107"    # Giallo
    low: "#F44336"       # Rosso
  
  high_threshold: 0.80
  medium_threshold: 0.50
  
  # Template per mostrare le confidenze
  show_confidence_badges: true
  show_confidence_percentage: true
  show_confidence_bar: true
